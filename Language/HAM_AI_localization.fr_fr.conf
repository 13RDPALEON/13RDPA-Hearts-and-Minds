 Texts {
  "L'IA ne se sert plus de son arme : elle continue de percevoir, de se déplacer et de suivre ses ordres, mais n'ouvre plus le feu. Fonctionne sur un personnage comme sur un groupe entier. N'apparaît que sur une IA qui peut encore tirer."
  "Interdire l'arme"
  "Rend à l'IA l'usage de son arme. N'apparaît que sur une IA dont l'arme est actuellement bloquée."
  "Rendre l'arme"
  "Rend à l'IA la décision de quitter son véhicule, comme dans le jeu d'origine. N'apparaît que si une consigne de maintien à bord est posée."
  "Débarquement libre"
  "Lève toutes les contraintes d'arme posées sur l'IA : arme interdite, levée, baissée, rangée ou réglage de port d'arme. Elle retrouve le contrôle du jeu d'origine et décide seule de lever, baisser, ranger ou changer d'arme. Une arme rangée est ressortie."
  "Arme libre"
  "Ouvre la bibliothèque pour choisir un groupe ou un personnage, puis le poste À L'INTÉRIEUR du bâtiment visé : postes de garde d'abord (fenêtres, balcons), positions intérieures ensuite, étage par étage. Chaque IA tient sa position. Les IA en trop pour la taille du bâtiment sont retirées. N'apparaît que si le curseur pointe un bâtiment."
  "Garnir le bâtiment"
  "Cloue l'IA sur place : elle continue de percevoir, de viser et de tirer, mais ne se déplace plus du tout. Fonctionne sur un personnage comme sur un groupe entier. N'apparaît que sur une IA qui peut encore bouger."
  "L'IA garde l'arme basse en permanence : posture de patrouille ou de checkpoint. Attention, tant que cet ordre tient elle ne visera ni ne tirera plus, même attaquée. Arme libre lui rend la décision. À distinguer d'Interdire l'arme, qui bloque le tir sans changer la position de l'arme."
  "Baisser l'arme"
  "L'IA garde l'arme en joue en permanence : sentinelle en alerte. Arme libre lui rend la décision."
  "Lever l'arme"
  "Rend sa liberté de déplacement à une IA immobilisée. N'apparaît que sur une IA actuellement clouée."
  "Rendre le mouvement"
  "Seuls le conducteur et les tireurs restent à bord ; les passagers débarquent normalement au contact. Le véhicule reste servi et mobile pendant que le reste du groupe combat à pied. Sur un groupe, la consigne vaut aussi pour les renforts."
  "Rester en véhicule (équipage seul)"
  "Plus personne ne débarque de son véhicule, même au contact : chacun reste à bord et continue de servir son poste, tourelle comprise. Sur un groupe, la consigne vaut aussi pour les renforts. Les ordres de débarquement ne s'exécutent pas tant que la consigne tient."
  "Multiplie la dispersion des tirs de ce personnage, par-dessus son niveau de compétence. Suit le réglage général tant qu'aucune valeur propre n'est saisie ; remettre la valeur affichée rétablit le suivi. À 0 ses tirs sont parfaitement précis, au-dessus de 1 ils s'écartent davantage."
  "Multiplie la dispersion des tirs des membres du groupe, par-dessus leur niveau de compétence. Suit le réglage général tant qu'aucune valeur propre n'est saisie ; remettre la valeur affichée rétablit le suivi. À 0 les tirs sont parfaitement précis, au-dessus de 1 ils s'écartent davantage."
  "Multiplie la dispersion des tirs de toutes les IA, par-dessus leur niveau de compétence. Par défaut 1 : à 0 les tirs sont parfaitement précis, au-dessus ils s'écartent davantage. Sans effet en compétence Cylon. Ne concerne que les IA laissées à 1 : rien ne se cumule."
  "Dispersion du tir"
  "Distance, en mètres, sous laquelle les soldats du groupe cessent d'avancer vers leur cible. Suit le style de combat tant qu'aucune valeur propre n'est saisie. À -1, le calcul d'origine s'applique : distance minimale de l'arme plus cinq mètres, au moins quinze."
  "Distance d'arrêt d'approche"
  "Activée, le groupe adopte de lui-même le style Mécanisé quand son chef monte à bord d'un véhicule : binômes en colonne, espacement routier. Le style choisi n'est pas perdu, il reprend effet dès que le chef débarque."
  "Mécanisé automatique en véhicule"
  "Activée, les points de recherche sont placés sur le sol réellement praticable, en trois dimensions : donc à l'intérieur des bâtiments et aux étages. Désactivée, ils restent au niveau du sol extérieur et les soldats tournent autour sans entrer. N'agit que pendant une inspection. Toujours active en style CQB offensif."
  "Fouille des bâtiments"
  "Quand le groupe engage, une équipe est désignée en couverture et les autres à l'assaut. Activés, l'équipe de couverture tient sa position et tire pendant que l'assaut progresse ; elle peut toujours se mettre à l'abri, se replier et se décaler, mais ne gagne plus de terrain. Désactivés, toutes les équipes progressent ensemble."
  "Rôles assaut et couverture"
  "Style de combat de ce groupe. Il l'emporte sur le style du scénario ; laissé sur Défaut, il suit ce dernier. Tout style autre que Défaut découpe le groupe en binômes, avec un trinôme si l'effectif est impair et jamais de soldat isolé. Il fixe formation, espacement et progression au contact, chacun restant modifiable séparément dans cet onglet."
  "Style appliqué à tous les groupes, renforts compris. Tout style autre que Défaut découpe le groupe en binômes, avec un trinôme si l'effectif est impair et jamais de soldat isolé. Offensif : front large. Urbain : file décalée. Défensif : coin, position tenue. Mécanisé : colonne. CQB : tenir ou assaillir un bâtiment."
  "Style de combat"
  "Détermine si les IA épuisent réellement leur dotation. Activée par défaut : à court de chargeurs, une IA passe au pistolet puis demande du ravitaillement. Désactivée, un chargeur identique lui est rendu à chaque rechargement. Un groupe peut recevoir son propre réglage."
  "Consommation des chargeurs"
  "Rayon d'alerte autour d'un contact, en mètres. Un groupe qui détecte un ennemi prévient par radio, après quelques secondes, les groupes amis dont le centre est à moins de cette distance du contact. À 0 le partage est désactivé. Seul un contact vu de ses propres yeux se propage : un groupe prévenu ne rediffuse pas."
  "Partage des contacts entre groupes"
  "Exiger un couvert : les soldats ne progressent que d'un abri à l'autre, quitte à rester en place faute de mieux. Progresser à découvert : ils avancent même sans abri à l'arrivée. Selon le style : l'exigence prévue par le style de combat du groupe."
  "Exigence de couvert"
  "Comportement de ce groupe quand un de ses soldats aperçoit un ennemi. Il l'emporte sur le réglage du scénario, qui l'emporte lui-même sur le style de combat. Riposte immédiate : le soldat tire depuis sa position, puis cherche un couvert. Couvert d'abord : il décroche avant de riposter, plus prudent mais souvent perdant sur le premier échange."
  "Par défaut une IA qui aperçoit un ennemi décroche vers un couvert avant de riposter, et perd donc presque toujours l'échange face à un adversaire qui tire d'emblée. Riposte immédiate : elle tire depuis sa position, puis cherche un couvert. Couvert d'abord : comportement d'origine."
  "Réflexe de couvert"
  "Le jeu ne traite que le cas d'un soldat déjà à couvert, qui s'y baisse pour recharger. À découvert, rien ne le prend en charge. Activée, il rompt vers l'abri le plus proche dès que le rechargement commence ; faute d'abri il reste en place plutôt que de courir pour rien."
  "Se mettre à l'abri pour recharger"
  "Vitesse de croisière des véhicules terrestres conduits par ce groupe, en km/h. Suit le réglage du scénario tant qu'aucune valeur propre n'est saisie ; remettre la valeur affichée rétablit le suivi. À -1, la vitesse d'origine s'applique. Un convoi lent et une patrouille rapide peuvent cohabiter. Les hélicoptères ne sont pas concernés."
  "Vitesse de croisière imposée aux véhicules terrestres conduits par l'IA, en km/h. À 0, la vitesse d'origine s'applique. La consigne est donnée au véhicule dès qu'un conducteur IA prend le poste. Un groupe peut recevoir sa propre vitesse. Les hélicoptères ne sont pas concernés."
  "Vitesse des véhicules"
  "Temps entre la détection d'un ennemi et le premier coup de feu de ce personnage, arme encore basse. Suit le réglage général tant qu'aucune valeur propre n'est saisie ; remettre la valeur affichée rétablit le suivi. À 0.2 il réagit au quart de tour même surpris ; à 4 il met un long moment."
  "Temps entre la détection d'un ennemi et le premier coup de feu des membres du groupe, arme encore basse. Suit le réglage général tant qu'aucune valeur propre n'est saisie ; remettre la valeur affichée rétablit le suivi."
  "Multiplie le temps entre la détection d'un ennemi et le premier coup de feu, arme encore basse : environ un quart de seconde au calme, huit dixièmes sous le feu, nul en alerte. Par défaut 1. À distinguer du temps de visée, qui intervient une fois l'arme épaulée."
  "Délai d'ouverture du feu"
  "Distance jusqu'à laquelle le groupe se déplace pour attaquer ou inspecter un contact ; le tir n'est pas limité par ce réglage. Suit le réglage du scénario tant qu'aucune valeur propre n'est saisie ; remettre la valeur affichée rétablit le suivi. À -1, aucune limite. Sans effet si le maintien de position est actif."
  "Distance jusqu'à laquelle un groupe se déplace pour attaquer ou inspecter un contact. Au-delà il ne manœuvre plus, mais le tir n'est pas limité pour autant. Mesurée depuis le centre du groupe. À -1, aucune limite. Sans effet si le maintien de position est actif."
  "Distance de manœuvre"
  "Décochée, cette entité devient invulnérable : personnage, véhicule ou objet destructible. La recocher rend les dégâts au fonctionnement d'origine. L'état de santé existant n'est pas modifié, et le réglage est conservé au redémarrage du serveur."
  "Dégâts actifs"
  "Décochée, cette entité disparaît pour tout le monde, joueurs comme IA, sans être supprimée : la recocher la fait réapparaître au même endroit, dans le même état. L'état est conservé au redémarrage du serveur. Utile pour préparer des décors ou révéler un élément au bon moment."
  "Entité visible"
  "Probabilité, en pourcentage, qu'un personnage tombé inconscient reste une cible pour l'IA. À 0 il cesse d'être visé dès qu'il est à terre, comme dans le jeu d'origine. Au-dessus, le sort de chaque blessé est tiré une seule fois, au moment où il perd connaissance."
  "Achever les blessés à terre"
  "Distance jusqu'à laquelle les soldats du groupe ouvrent le feu sur un ennemi repéré ; au-delà ils surveillent sans tirer. Suit le réglage du scénario tant qu'aucune valeur propre n'est saisie. À -1, aucune limite. Utile pour une embuscade : le groupe laisse approcher et n'ouvre le feu qu'à la distance choisie."
  "Distance jusqu'à laquelle les IA ouvrent le feu sur un ennemi repéré. Au-delà elles le surveillent et le rapportent, sans tirer. À -1, aucune limite. Ne gouverne que l'ouverture du feu : une IA prise à partie répond selon la distance de riposte. Le tir de suppression suit la même règle."
  "Distance de tir à vue"
  "Activée, les trajets alignés sur l'axe direct vers l'ennemi sont fortement pénalisés : les soldats empruntent les cheminements de côté et abordent la position par un angle plutôt que de traverser le découvert. Le côté n'est pas imposé, il découle du terrain. Sans effet lors d'un déplacement vers un couvert."
  "Approche par contournement"
  "Attirance de ce groupe pour les routes lors de ses déplacements à pied. Suivre le réglage général : le scénario décide, et le groupe suit ses changements. Toute autre valeur l'emporte pour ce groupe seul. S'applique immédiatement, renforts compris ; les trajets en cours se corrigent au prochain calcul de chemin."
  "Attirance des IA à pied pour les routes. Routes privilégiées : un détour routier est accepté jusqu'à environ deux fois et demie le vol d'oiseau. Équilibré (défaut) : elles coupent volontiers à travers le terrain. Sentiers, Éviter et Interdites durcissent progressivement le refus du bitume. Les trajets en cours se corrigent au prochain calcul de chemin."
  "Navigation à pied"
  "Espacement de la formation de chaque binôme, en multiple de l'espacement d'origine du jeu. Suit le style de combat tant qu'aucune valeur propre n'est saisie ; remettre la valeur affichée rétablit le suivi."
  "Espacement de la formation"
  "Disposition de chaque binôme en déplacement. Coin : secteurs de tir répartis autour du binôme. Ligne : front large. Colonne : file simple, pour les passages étroits. File décalée : soldats alternés de part et d'autre, pour couvrir les angles en urbain. Selon le style : celle prévue par le style de combat."
  "Formation des binômes"
  "Décochée, les réservoirs des véhicules conduits par ce groupe ne se vident plus, quel que soit le multiplicateur réglé en dessous et quel que soit le réglage du scénario. C'est la manière la plus directe de donner du carburant illimité à l'IA sans rien changer pour les joueurs : la consigne est lue en remontant au conducteur, et un véhicule aux mains d'un joueur n'a pas de conducteur IA."
  "Décochée, les réservoirs ne se vident plus : aucun véhicule ne tombe en panne sèche, ravitaillement et jerricans deviennent inutiles. Le multiplicateur réglé en dessous est mémorisé et revient tel quel quand la case est recochée. S'applique aux véhicules des joueurs comme à ceux de l'IA."
  "Consommation de carburant"
  "Vitesse à laquelle se vident les réservoirs des véhicules conduits par ce groupe. C'est le réglage qui sépare l'IA des joueurs : il est lu en remontant au conducteur, or un véhicule aux mains d'un joueur n'a pas de conducteur IA et reste sur le réglage du scénario. À 0 ces véhicules ne consomment plus rien. Suit le scénario tant qu'aucune valeur propre n'est saisie."
  "Vitesse à laquelle les réservoirs se vident. À 0 plus aucune consommation. À x1 la consommation est celle du monde réel, ce qui rend les pleins très durables ; x8 est la valeur d'origine du jeu, calibrée pour que le carburant compte à l'échelle d'une partie. Au-delà, le ravitaillement devient une contrainte logistique."
  "Multiplicateur de consommation"
  "Le groupe n'engage plus d'ennemis repérés hors de la zone définie par le rayon de maintien. Ne le cloue pas sur place : les soldats gardent toute leur liberté de mouvement, y compris au contact. Pour les clouer, utiliser Immobiliser. Les ordres de déplacement ne s'exécutent pas tant que le maintien est actif."
  "Maintien de position"
  "Rayon de la zone définie par le maintien de position, mesuré depuis le centre du groupe au moment où la consigne est donnée. Sans effet si le maintien de position n'est pas actif."
  "Rayon de maintien"
  "Temps passé à l'arrêt entre deux bonds au contact, en secondes, dans le cas de référence : à couvert et hors suppression, soit 5 secondes d'origine. Les autres situations s'ajustent proportionnellement : à découvert plus court, sous suppression environ quatre fois plus long. Suit le style de combat tant qu'aucune valeur propre n'est saisie."
  "Durée d'immobilité entre bonds"
  "Cloue ce personnage sur place. Il continue de percevoir, de viser et de tirer, mais ne se déplace plus, quels que soient ses ordres. Utile pour figer une sentinelle ou un tireur à un emplacement précis. Cette consigne l'emporte sur tout le reste."
  "Cloue tous les membres du groupe sur place. Ils continuent de percevoir, de viser et de tirer, mais ne se déplacent plus, quels que soient leurs ordres. Cette consigne l'emporte sur tout le reste."
  "Durée, en secondes, pendant laquelle le groupe continue de fouiller sans information nouvelle, tant qu'un ennemi est supposé vivant. Valeur d'origine 120 s. Une valeur élevée rend le groupe tenace et difficile à semer, une valeur basse le fait renoncer vite."
  "Durée de l'inspection"
  "Rayon minimal, en mètres, de la zone fouillée autour du dernier contact connu. Valeur d'origine 20 m ; la zone s'élargit d'elle-même si les contacts sont dispersés. Une valeur élevée fait ratisser large et disperse le groupe, une valeur basse concentre la recherche."
  "Rayon de l'inspection"
  "Activée, une équipe se détache pour aller vérifier la dernière position connue d'un ennemi perdu de vue. Désactivée, le groupe reste en place et surveille la zone, ce qui convient à une garnison ou à un poste fixe. Sans effet en style CQB défensif, qui ne part jamais inspecter."
  "Inspection des contacts perdus"
  "Détermine si les membres du groupe épuisent leur dotation. Il l'emporte sur le réglage du scénario. Consomme ses chargeurs : à court de munitions, un soldat passe au pistolet puis demande du ravitaillement. Chargeurs illimités : un chargeur identique lui est rendu à chaque rechargement."
  "Les IA équipées de jumelles de vision nocturne les abaissent à la tombée de la nuit et les relèvent au lever du jour. Désactivé, elles gardent leurs jumelles relevées en permanence."
  "Vision nocturne automatique"
  "Vitesse de reconnaissance d'une IA qui porte ses jumelles de vision nocturne abaissées. Ce n'est pas une portée de détection : le moteur multiplie la rapidité avec laquelle l'IA identifie un contact. L'échelle du jeu est étroite, 1 est la valeur standard, 3 correspond aux jumelles, 0.4 à une IA sous le feu. Réglé sur 3 par défaut, le bonus le plus fort que le jeu accorde à un équipement. Au-delà de 3 on sort de la plage réglée par Bohemia et l'IA peut devenir erratique."
  "Perception sous vision nocturne"
  "Perception de nuit sans NVG"
  "Vitesse de reconnaissance de nuit d'une IA qui n'a pas de NVG descendues, appliquée seulement entre le coucher et le lever du soleil. Même échelle étroite que le jeu : 1 est la valeur standard, 3 correspond aux jumelles, 0.4 à une IA sous le feu. À 1, rien ne change. En dessous, elle identifie encore plus lentement dans le noir. Sans effet sur une IA dont les NVG sont descendues : celle-ci a son propre curseur."
  "Vitesse à laquelle ce personnage repère ses cibles à vue. Suit le réglage général tant qu'aucune valeur propre n'est saisie ; remettre la valeur affichée rétablit le suivi. En dessous il voit plus tard, au-dessus plus tôt et de plus loin."
  "Vitesse à laquelle les membres du groupe repèrent leurs cibles à vue. Suit le réglage général tant qu'aucune valeur propre n'est saisie ; remettre la valeur affichée rétablit le suivi. En dessous ils voient plus tard, au-dessus plus tôt et de plus loin."
  "Vitesse à laquelle toutes les IA repèrent leurs cibles à vue. Par défaut 1 : en dessous elles voient plus tard, au-dessus plus tôt et de plus loin. Une IA sous le feu voit toujours nettement moins bien, quel que soit ce réglage. Ne concerne que les IA laissées à 1 : rien ne se cumule."
  "Perception"
  "Temps que ce personnage passe à stabiliser sa visée avant de tirer. Suit le réglage général tant qu'aucune valeur propre n'est saisie ; remettre la valeur affichée rétablit le suivi. À 0.3 le tir part au plus vite, un plancher interne empêchant de descendre plus bas ; à 3 il prend un long temps."
  "Temps que les membres du groupe passent à stabiliser leur visée avant de tirer. Suit le réglage général tant qu'aucune valeur propre n'est saisie ; remettre la valeur affichée rétablit le suivi."
  "Multiplie le temps que les IA passent à stabiliser leur visée avant de tirer. Par défaut 1, soit environ quatre dixièmes de seconde. À 0.3 le tir part au plus vite ; en dessous un plancher interne s'applique, le canon devant avoir convergé sur la cible avant le départ du coup."
  "Temps de visée avant tir"
  "Distance jusqu'à laquelle les soldats du groupe rendent le feu à une cible qui les vise ou leur tire dessus, même au-delà de leur distance de tir à vue. Toujours au moins égale à celle-ci. Suit le réglage du scénario tant qu'aucune valeur propre n'est saisie. À -1, aucune limite."
  "Distance jusqu'à laquelle une IA rend le feu à une cible qui la vise ou lui tire dessus, même au-delà de sa distance de tir à vue. Toujours au moins égale à celle-ci. À -1, aucune limite : recommandé, sans quoi les IA peuvent être prises pour cible impunément à longue distance."
  "Distance de riposte"
  "Niveau de tir de ce personnage. N'agit que sur la précision : il ouvre le feu à la même vitesse quel que soit son niveau. Du plus large au plus serré : Bleu, Débutant, Régulier, Vétéran, Expert. Cylon vise sans erreur. Suivre le réglage global lui rend le niveau du scénario."
  "Niveau de tir de tous les membres du groupe. N'agit que sur la précision : ils ouvrent le feu à la même vitesse quel que soit leur niveau. Du plus large au plus serré : Bleu, Débutant, Régulier, Vétéran, Expert. Cylon vise sans erreur. Suivre le réglage global leur rend le niveau du scénario."
  "Niveau de tir de toutes les IA, renforts compris. N'agit que sur la précision : un Expert ouvre le feu aussi vite qu'un Bleu, il place seulement ses tirs bien plus près. Du plus large au plus serré : Bleu, Débutant, Régulier, Vétéran, Expert. Cylon vise sans erreur."
  "Compétence de tir"
  "Activée, les IA cessent de tirer sur un personnage ne portant aucune arme, tout en continuant de le voir et de rester en alerte. Le critère est l'absence totale d'arme : une arme rangée dans le dos ou de poing suffit à rester une cible. Utile pour les civils, prisonniers et blessés désarmés."
  "Épargner les personnages sans arme"
  "Impose une posture à ce personnage. Automatique : il s'accroupit dès qu'il est alerté, même sur une longue distance, et se couche sous le feu. Debout, Accroupi et Allongé la fixent en permanence. Jamais allongé : debout ou accroupi, sans jamais se mettre au sol. Debout en alerte : debout tant qu'il n'est pas pris à partie, accroupi à couvert ensuite, le choix le plus réaliste. Par défaut, suit le réglage général du scénario."
  "Impose une posture à tous les membres du groupe. Automatique : chacun s'accroupit dès qu'il est alerté, même sur une longue distance, et se couche sous le feu. Debout, Accroupi et Allongé la fixent en permanence. Jamais allongé : debout ou accroupi, sans jamais se mettre au sol. Debout en alerte : debout tant qu'ils ne sont pas pris à partie, accroupis à couvert ensuite. Par défaut, suit le réglage général du scénario."
  "Posé (ne balaie plus)"
  "Concentré (garde son contact)"
  "Mémoire du contact"
  "Durée, en secondes, pendant laquelle une IA continue de regarder un contact qu'elle ne voit plus. Le jeu d'origine s'arrête à une seconde : il suffit qu'un joueur baisse la tête un instant pour que l'IA décroche et reparte regarder ailleurs. Monter la valeur la fait surveiller l'endroit où le contact a disparu. Un groupe ou un personnage réglé à sa propre valeur la conserve."
  "Durée pendant laquelle les membres du groupe continuent de regarder un contact perdu, en secondes. Suit le réglage général du scénario tant qu'on ne lui donne pas sa propre valeur ; réécrire la valeur affichée rétablit le suivi automatique."
  "Durée pendant laquelle ce personnage continue de regarder un contact perdu, en secondes. Suit le réglage général du scénario tant qu'on ne lui donne pas sa propre valeur ; réécrire la valeur affichée rétablit le suivi automatique."
  "Regard"
  "Regard tenu"
  "Comportement du regard de toutes les IA de la carte, renforts compris. Automatique : comportement d'origine. Posé : plus de balayage permanent, l'IA garde sa direction mais se tourne vers un danger qu'elle perçoit. Concentré : elle ignore en plus les dangers qui ne la visent pas et continue de surveiller un contact qu'elle vient de perdre. Regard tenu : seuls un ennemi qu'elle voit ou un tir qui la vise déplacent son regard. Un personnage ou un groupe ayant reçu son propre réglage le conserve : celui-ci ne concerne que ceux laissés sur Suivre le réglage général."
  "Comportement du regard des membres du groupe. Automatique : comportement d'origine. Posé : plus de balayage permanent, l'IA garde sa direction mais se tourne vers un danger qu'elle perçoit. Concentré : elle ignore en plus les dangers qui ne la visent pas et continue de surveiller un contact qu'elle vient de perdre. Regard tenu : seuls un ennemi qu'elle voit ou un tir qui la vise déplacent son regard. Par défaut, suit le style de combat du groupe, qui retombe lui-même sur le réglage général du scénario."
  "Comportement du regard de ce personnage. Automatique : comportement d'origine. Posé : plus de balayage permanent, l'IA garde sa direction mais se tourne vers un danger qu'elle perçoit. Concentré : elle ignore en plus les dangers qui ne la visent pas et continue de surveiller un contact qu'elle vient de perdre. Regard tenu : seuls un ennemi qu'elle voit ou un tir qui la vise déplacent son regard. Une IA immobilisée tient son regard quel que soit ce réglage. Par défaut, suit le réglage de son groupe."
  "Distance d'attention"
  "Distance, en mètres, au-delà de laquelle un bruit ou une explosion ne détourne plus l'attention d'une IA. À -1, aucune limite : comportement d'origine, une déflagration à l'autre bout du village fait tourner la tête à tout le monde. Baisser la valeur garde les IA concentrées sur ce qui se passe près d'elles, le danger le plus proche l'emportant sur le plus bruyant. Sans effet sur un tir qui vise l'IA ou qui l'a touchée : dans ce cas elle réagit toujours, quelle que soit la distance."
  "Posture appliquée à toutes les IA de la carte, renforts compris. Automatique : chacune décide seule, elle s'accroupit dès qu'elle est alertée, même sur une longue distance, et se couche sous le feu. Debout, Accroupi et Allongé la fixent en permanence. Jamais allongé : debout ou accroupi, sans jamais se mettre au sol. Debout en alerte : debout tant qu'elle n'est pas prise à partie, accroupie à couvert ensuite, le choix le plus réaliste. Un personnage ou un groupe ayant reçu sa propre posture la conserve : ce réglage ne concerne que ceux laissés sur Suivre le réglage général."
  "Posture"
  "Consigne véhicule de ce personnage. Suivre le réglage général : son groupe décide, à défaut le scénario. Tout le monde reste à bord : il ne débarque plus de lui-même, même au contact. Équipage seul : il ne reste que s'il conduit ou sert une tourelle. Débarquement libre : il décide seul, même si son groupe ou le scénario impose une consigne."
  "Consigne véhicule des membres du groupe. Suivre le réglage général : le scénario décide, et le groupe suit ses changements. Tout le monde reste à bord : personne ne débarque de lui-même, même au contact. Équipage seul : conducteur et tireurs restent, les passagers débarquent. Débarquement libre : ce groupe décide seul, même si le scénario impose une consigne. Les renforts adoptent la consigne."
  "Consigne véhicule appliquée à toutes les IA, renforts compris. Tout le monde reste à bord : personne ne débarque de lui-même, même au contact. Équipage seul : conducteur et tireurs restent, les passagers débarquent normalement. Les ordres de débarquement donnés en Game Master ne s'exécutent pas tant qu'une consigne tient."
  "Distance, en mètres, à laquelle les IA entendent un tir SILENCÉ. Valeur d'origine 100 m. À 0 elles ne l'entendent pas du tout, ce qui permet de neutraliser une sentinelle sans alerter le voisinage. Les tirs non silencés restent audibles à 500 m. N'affecte que l'ouïe de l'IA."
  "Audibilité des tirs silencés"
  "Activé par défaut : le groupe arrose une position d'où il sait qu'un ennemi tire, même sans le voir. Ne se déclenche qu'entre 30 et 800 mètres, sur une information récente, et jamais si un allié est dans la zone visée. Désactivé, le groupe ne tire que sur ce qu'il voit, plus discret mais il ne fixe plus l'ennemi."
  "Tir de suppression"
  "Vue des membres du groupe sous le feu. Suit le réglage général tant qu'aucune valeur propre n'est saisie. Le jeu d'origine écrase la perception d'une IA suppressée à environ un tiers ; vers 8 l'écrasement est annulé. Ne touche que la vue."
  "Vue des IA sous le feu. Le jeu d'origine écrase leur perception à environ un tiers : elles deviennent quasi aveugles tant qu'on leur tire dessus. À 1 rien ne change, vers 8 l'écrasement est annulé. Ne touche que la vue : mise à couvert et réaction à la suppression restent d'origine."
  "Perception sous le feu"
  "Vitesse à laquelle se vide le réservoir de CE véhicule, quel que soit son conducteur. Elle l'emporte sur le réglage du groupe comme sur celui du scénario, et vaut donc aussi pour un véhicule de joueur. À 0 il ne consomme plus rien. Suit le groupe ou le scénario tant qu'aucune valeur propre n'est saisie. Consigne de partie, non conservée au redémarrage."
  "Décochée, le réservoir de CE véhicule ne se vide plus, quel que soit son conducteur : elle l'emporte sur le réglage du groupe comme sur celui du scénario, et vaut donc aussi pour un véhicule de joueur. Utile pour un hélicoptère de liaison ou un convoi qui doit tenir la distance. Consigne de partie, non conservée au redémarrage."
  "Consommation du véhicule"
  "Attirance pour les routes des véhicules conduits par ce groupe. Suivre le réglage général : le scénario décide, et le groupe suit ses changements. Toute autre valeur l'emporte pour ce groupe seul : un convoi cloué au réseau routier pendant qu'une patrouille approche en hors-piste. Poussé au véhicule dès qu'un conducteur du groupe prend le poste."
  "Attirance des véhicules conduits par l'IA pour chaque type de sol. Réseau routier seulement : le hors-piste est réservé aux impasses. Routes privilégiées (défaut) : la route est préférée, le hors-piste reste envisagé. Pistes, Éviter le bitume, Hors-piste seulement et Libre déplacent le curseur vers le tout-terrain. Poussé au véhicule dès qu'un conducteur IA prend le poste."
  "Navigation véhicule"
  "Vitesse de croisière de CE véhicule quand une IA le conduit, en km/h. Prioritaire sur le réglage du groupe conducteur et sur celui du scénario. Suit le scénario tant qu'aucune valeur propre n'est saisie. À -1, la vitesse d'origine s'applique. Immédiat si une IA est au volant, sans effet sur un conducteur joueur. Consigne de partie, non conservée au redémarrage."
  "Vitesse du véhicule"
  "Qui doit avoir atteint le rayon de ce waypoint pour le déclencher et l'accomplir. N'importe quel membre (défaut du mod) : le premier arrivé suffit, et pour Monter ou Débarquer la manœuvre commence dès qu'un membre entre dans le rayon. Le chef du groupe : seul le chef compte. Tout le groupe : attend le dernier membre."
  "Complétion du waypoint"
  "Rayon d'action du waypoint sélectionné, en mètres : la zone qu'un groupe en défense tient, ou le rayon d'une patrouille. La laisse de l'IA suit immédiatement, halo compris. S'applique au waypoint sélectionné seulement."
  "Rayon de zone"
  "Consigne de feu portée par CETTE zone de défense, pour tout groupe qui la tient. Suivre les réglages du groupe (défaut) : la zone n'impose rien. Tir à vue : feu libre dans la zone, quelles que soient les distances réglées. Tir sur riposte seulement : uniquement sur qui le vise ou lui tire dessus. Halte au feu : observe sans jamais tirer. La zone supprimée, le groupe reprend ses propres réglages."
  "Discipline de feu de la zone"
  "Style de combat imposé par CETTE zone de défense, pour tout groupe qui la tient. Suivre le réglage du groupe (défaut) : la zone n'impose rien. Tout autre choix l'emporte sur le style du groupe tant que la zone existe : formation, espacement, usage du couvert, agressivité. La zone supprimée, le groupe reprend son propre style."
