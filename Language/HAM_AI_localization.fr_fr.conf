  "Tout le groupe"
  "Range l'arme jusqu'au prochain engagement, puis rend à l'IA son réglage de port habituel. N'apparaît que si l'arme est sortie."
  "Ranger l'arme"
  "Port de l'arme de ce personnage. Suivre le réglage général : son groupe décide, sinon le scénario. Automatique : comportement d'origine. Engagement : arme sortie seulement face à une cible ennemie. Alerte : arme sortie tant que l'IA reste en alerte. Maintenue : elle ne la range plus après son premier engagement."
  "Port de l'arme des membres du groupe. Suivre le réglage général : le scénario décide. Automatique : comportement d'origine. Engagement : arme sortie seulement face à une cible ennemie. Alerte : arme sortie tant que l'IA reste en alerte. Maintenue : elle ne la range plus après son premier engagement. Un personnage ayant son propre réglage le conserve."
  "Port de l'arme appliqué à toutes les IA de la carte, renforts compris. Automatique : comportement d'origine. Engagement : arme sortie seulement face à une cible ennemie. Alerte : arme sortie tant que l'IA reste en alerte. Maintenue : elle ne la range plus après son premier engagement. Un groupe ou un personnage ayant son propre réglage le conserve."
  "Port de l'arme"
  "Pendant l'alerte"
  "Automatique (jeu d'origine)"
  "Uniquement pendant l'engagement"
  "Sortie maintenue après engagement"
  "Sort l'arme et la garde sortie. Si le réglage de port de l'IA la rangerait de nouveau, l'IA passe en arme libre. N'apparaît que si l'arme est rangée."
  "Sortir l'arme"
  "Mode de tir"
  "Autonome"
  "Coup par coup"
  "Rafale"
  "Full auto"
  "Mode de tir de toutes les IA. Autonome laisse le comportement d'origine. Les autres valeurs imposent le sélecteur de l'arme, quand l'arme possède ce mode : une mitrailleuse reste en rafale. Un groupe ou un personnage ayant son propre réglage le conserve."
  "Mode de tir des membres du groupe. Suivre le réglage général laisse le scénario décider. Les autres valeurs imposent le sélecteur de l'arme, quand l'arme possède ce mode : une mitrailleuse reste en rafale. Les renforts rejoignant le groupe adoptent le réglage."
  "Des opérateurs IA lancent des drones de reconnaissance qui repèrent les ennemis et les signalent aux groupes amis situés dans la portée de partage des contacts."
  "Drones de reconnaissance IA"
  "Les drones de reconnaissance peuvent larguer une grenade sur une cible repérée. Disponible uniquement si les drones de reconnaissance IA sont activés."
  "Drones de bombardement"
  "Nombre maximal de drones de reconnaissance IA en vol en même temps."
  "Nombre maximal de drones"
  "Délai minimal entre deux drones de reconnaissance, en minutes. Il court à partir de la fin du vol précédent : il y a donc toujours une période sans drone en l'air."
  "Intervalle entre les drones"
