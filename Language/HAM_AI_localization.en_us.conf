 Texts {
  "The AI stops using its weapon: it goes on perceiving, moving and following orders, but never opens fire. Works on a single character or on a whole group. Only shown on an AI that can still shoot."
  "Forbid Weapon"
  "Gives the AI the use of its weapon back. Only shown on an AI whose weapon is currently locked."
  "Restore Weapon"
  "Hands the AI back the decision to leave its vehicle, as in vanilla. Only shown if a stay in vehicle order is in force."
  "Free Disembark"
  "Removes every weapon constraint set on the AI: weapon forbidden, raised, lowered, holstered or weapon carry setting. It regains vanilla control and decides on its own when to raise, lower, holster or switch weapons. A holstered weapon is drawn again."
  "Free Weapon"
  "Opens the library to pick a group or a character, then posts them INSIDE the targeted building: guard posts first (windows, balconies), then interior positions, floor by floor. Each AI holds its position. Any AI beyond what the building can hold is removed. Only shown when the cursor is on a building."
  "Garrison Building"
  "Pins the AI in place: it goes on perceiving, aiming and firing, but no longer moves at all. Works on a single character or on a whole group. Only shown on an AI that can still move."
  "The AI keeps its weapon lowered at all times: a patrol or checkpoint posture. Careful, while this order holds it will neither aim nor fire, even when attacked. Free weapon hands the decision back. Not to be confused with Forbid weapon, which blocks firing without changing how the weapon is carried."
  "Lower Weapon"
  "The AI keeps its weapon shouldered at all times: an alert sentry. Free weapon hands the decision back."
  "Raise Weapon"
  "Gives an immobilized AI its freedom of movement back. Only shown on an AI that is currently pinned."
  "Release Movement"
  "Only the driver and gunners stay aboard; passengers dismount as usual in contact. The vehicle stays manned and mobile while the rest of the group fights on foot. On a group, the order covers reinforcements too."
  "Stay In Vehicle (Crew Only)"
  "Nobody dismounts from their vehicle any more, even in contact: each stays aboard and keeps manning their position, turrets included. On a group, the order covers reinforcements too. Disembark orders will not run while the order is in force."
  "Multiplies this character's shot dispersion, on top of his marksmanship level. Follows the scenario setting until you enter a value of its own; re-entering the displayed value restores automatic tracking. At 0 his shots are perfectly accurate, above 1 they spread further."
  "Multiplies this group's shot dispersion, on top of their marksmanship level. Follows the scenario setting until you enter a value of its own; re-entering the displayed value restores automatic tracking. At 0 shots are perfectly accurate, above 1 they spread further."
  "Multiplies the shot dispersion of all AI, on top of their marksmanship level. Default 1: at 0 shots are perfectly accurate, above it they spread further. No effect on Cylon marksmanship. Only affects AI left at 1: nothing stacks."
  "Shot Dispersion"
  "Distance, in metres, below which this group's soldiers stop closing on their target. Follows the combat style until you enter a value of its own. At -1, the vanilla calculation applies: the weapon's minimum range plus five metres, at least fifteen."
  "Approach Stop Distance"
  "Enabled, the group switches itself to the Mechanized style when its leader boards a vehicle: buddy teams in column, road spacing. The chosen style is not lost, it takes effect again as soon as the leader dismounts."
  "Auto Mechanized In Vehicle"
  "Enabled, search points are placed on ground that is actually walkable, in three dimensions: inside buildings and on upper floors. Disabled, they stay at outdoor ground level and soldiers circle the building without entering. Only applies during an investigation. Always on for the CQB Offensive style."
  "Building Search"
  "When the group engages, one team is put in support and the others assault. Enabled, the support team holds its ground and fires while the assault moves; it can still take cover, fall back and shift, but no longer gains ground. Disabled, every team advances together."
  "Assault And Support Roles"
  "This group's combat style. It overrides the scenario style; left on Default, it follows it. Any style other than Default splits the group into buddy teams, using a three-soldier team on odd numbers and never leaving anyone alone. It sets formation, spacing and how the group closes in, each of which stays adjustable on its own in this tab."
  "Style applied to every group on the map, reinforcements included. Any style other than Default splits a group into buddy teams, using a three-soldier team on odd numbers and never leaving anyone alone. Offensive: wide front. Urban: staggered file. Defensive: wedge, holds ground. Mechanized: column. CQB: hold or assault a building."
  "Combat Style"
  "Whether AI actually use up their ammunition load. Enabled by default: out of magazines, an AI switches to its sidearm then calls for resupply. Disabled, an identical magazine is handed back on every reload. A group can be given its own setting."
  "Magazine Consumption"
  "Alert radius around a contact, in metres. A group that spots an enemy radios in after a few seconds, reaching friendly groups whose centre lies within that distance of the contact. At 0 sharing is off. Only a contact seen first hand spreads: a group told by radio does not relay it."
  "Contact Sharing Between Groups"
  "Cover required: soldiers only move from one piece of cover to the next, staying put if there is nothing better. Advance in the open: they move even with no cover at the far end. From combat style: whatever the group's style calls for."
  "Cover Requirement"
  "How this group behaves when one of its soldiers spots an enemy. It overrides the scenario setting, which itself overrides the combat style. Return fire immediately: the soldier fires from where he stands, then looks for cover. Cover first: he breaks away before answering, safer but usually losing the first exchange."
  "By default an AI that spots an enemy breaks for cover before returning fire, and so almost always loses the exchange against someone who shoots straight away. Return fire immediately: it fires from where it stands, then looks for cover. Cover first: vanilla behaviour."
  "Cover Reflex"
  "Vanilla only handles a soldier already in cover, who ducks down to reload. In the open, nothing takes over. Enabled, he breaks for the nearest cover as soon as the reload starts; with none available he stays put rather than run for nothing."
  "Take Cover To Reload"
  "Cruise speed of ground vehicles driven by this group, in km/h. Follows the scenario setting until you enter a value of its own; re-entering the displayed value restores automatic tracking. At -1, the vanilla speed applies. A slow convoy and a fast patrol can coexist. Helicopters are not affected."
  "Cruise speed forced on ground vehicles driven by AI, in km/h. At 0, the vanilla speed applies. The order is handed to the vehicle as soon as an AI takes the driver seat. A group can be given its own speed. Helicopters are not affected."
  "Vehicle Speed"
  "Time between spotting an enemy and this character's first shot, weapon still lowered. Follows the scenario setting until you enter a value of its own; re-entering the displayed value restores automatic tracking. At 0.2 he reacts instantly even when surprised; at 4 he takes a long while."
  "Time between spotting an enemy and this group's first shot, weapon still lowered. Follows the scenario setting until you enter a value of its own; re-entering the displayed value restores automatic tracking."
  "Multiplies the time between spotting an enemy and the first shot, weapon still lowered: about a quarter second when calm, eight tenths under fire, none when already alert. Default 1. Distinct from aiming time, which happens once the weapon is shouldered."
  "Delay Before Opening Fire"
  "How far this group will move to attack or investigate a contact; firing is not restricted by this. Follows the scenario setting until you enter a value of its own; re-entering the displayed value restores automatic tracking. At -1, no limit. No effect while hold position is active."
  "How far a group will move to attack or investigate a contact. Beyond that it no longer manoeuvres, but firing is not restricted by this. Measured from the group centre. At -1, no limit. No effect while hold position is active."
  "Manoeuvre Range"
  "Unticked, this entity becomes invulnerable: character, vehicle or destructible object. Ticking it again restores damage to its vanilla behaviour. Existing health is left untouched, and the setting survives a server restart."
  "Damage Enabled"
  "Unticked, this entity vanishes for everyone, players and AI alike, without being deleted: ticking it again brings it back in the same place and the same state. The state survives a server restart. Useful to stage scenery or reveal something at the right moment."
  "Entity Visible"
  "Chance, as a percentage, that a character knocked unconscious remains a target for AI. At 0 they stop being shot at the moment they go down, as in vanilla. Above that, each casualty is rolled once, at the moment they lose consciousness."
  "Finish Off Downed Casualties"
  "How far this group's soldiers will open fire on a spotted enemy; beyond that they watch without shooting. Follows the scenario setting until you enter a value of its own. At -1, no limit. Useful for an ambush: the group lets the enemy close and only opens fire at the chosen range."
  "How far AI will open fire on a spotted enemy. Beyond that they watch and report without shooting. At -1, no limit. Governs opening fire only: an AI taken under fire answers according to the return fire range. Suppressive fire follows the same rule."
  "Fire At Will Range"
  "Enabled, routes lined up with the direct axis to the enemy are heavily penalised: soldiers take the side approaches and come at the position from an angle rather than crossing the open ground. The side is not dictated, it falls out of the terrain. No effect when moving to cover."
  "Flanking Approach"
  "How strongly this group is drawn to roads when moving on foot. Follow scenario setting: the scenario decides, and the group tracks its changes. Any other value takes over for this group alone. Applies at once, reinforcements included; routes already under way correct themselves at the next path calculation."
  "How strongly AI on foot are drawn to roads. Roads preferred: a road detour is accepted up to roughly two and a half times the straight line. Balanced (default): they happily cut across country. Trails, Avoid and Forbidden progressively harden the refusal of tarmac. Routes already under way correct themselves at the next path calculation."
  "Foot Navigation"
  "Spacing of each buddy team's formation, as a multiple of the vanilla spacing. Follows the combat style until you enter a value of its own; re-entering the displayed value restores automatic tracking."
  "Formation Spacing"
  "How each buddy team is arranged on the move. Wedge: arcs of fire spread around the team. Line: wide front. Column: single file, for narrow ground. Staggered file: soldiers alternating either side, to cover corners in built-up areas. From combat style: whatever the style calls for."
  "Buddy Team Formation"
  "Unticked, the tanks of vehicles driven by this group stop draining, whatever multiplier is set below and whatever the scenario setting. This is the most direct way to give the AI unlimited fuel without changing anything for players: the order is read by looking up at the driver, and a vehicle in a player's hands has no AI driver."
  "Unticked, tanks stop draining: no vehicle ever runs dry, and refuelling and jerry cans become pointless. The multiplier set below is remembered and comes back unchanged when the box is ticked again. Applies to player and AI vehicles alike."
  "Fuel Consumption"
  "How fast the tanks of vehicles driven by this group drain. This is the setting that separates AI from players: it is read by looking up at the driver, and a vehicle in a player's hands has no AI driver, so it stays on the scenario setting. At 0 these vehicles consume nothing at all. Follows the scenario until you enter a value of its own."
  "How fast fuel tanks drain. At 0 nothing is consumed at all. At x1 consumption matches the real world, which makes a full tank last a very long time; x8 is the vanilla value, tuned so fuel matters over the course of a session. Above that, refuelling becomes a logistical constraint."
  "Consumption Multiplier"
  "The group stops engaging enemies spotted outside the area set by the hold radius. It is not pinned: soldiers keep full freedom of movement, including in contact. To pin them, use Immobilize. Movement orders will not run while hold position is active."
  "Hold Position"
  "Radius of the area set by hold position, measured from the group centre at the moment the order is given. No effect if hold position is not active."
  "Hold Radius"
  "Time spent halted between bounds in contact, in seconds, for the reference case: in cover and not suppressed, which is 5 seconds in vanilla. Other situations scale from it: shorter in the open, roughly four times longer under suppression. Follows the combat style until you enter a value of its own."
  "Pause Between Bounds"
  "Pins this character in place. He goes on perceiving, aiming and firing, but no longer moves, whatever his orders. Useful to fix a sentry or a marksman at an exact spot. This order overrides everything else."
  "Pins every member of the group in place. They go on perceiving, aiming and firing, but no longer move, whatever their orders. This order overrides everything else."
  "How long, in seconds, the group keeps searching with no fresh information, as long as an enemy is presumed alive. Vanilla value is 120 s. A high value makes the group dogged and hard to shake, a low value makes it give up quickly."
  "Investigation Duration"
  "Minimum radius, in metres, of the area searched around the last known contact. Vanilla value is 20 m; the area widens on its own if contacts are scattered. A high value sweeps wide and spreads the group out, a low value keeps the search tight."
  "Investigation Radius"
  "Enabled, a team peels off to check the last known position of an enemy lost from sight. Disabled, the group stays put and watches the area, which suits a garrison or a fixed post. No effect on the CQB Defensive style, which never leaves to investigate."
  "Investigate Lost Contacts"
  "Whether this group's members use up their ammunition load. It overrides the scenario setting. Consumes magazines: out of ammunition, a soldier switches to his sidearm then calls for resupply. Unlimited magazines: an identical magazine is handed back on every reload."
  "AI carrying night vision goggles lower them at nightfall and raise them at daybreak. Disabled, they keep their goggles raised at all times."
  "Automatic Night Vision"
  "Recognition speed of an AI wearing its night vision goggles down. This is not a detection range: the engine multiplies how fast the AI identifies a contact. The game scale is narrow, 1 is standard, 3 is what binoculars give, 0.4 is what suppression leaves. It ships at 3, the strongest bonus the game grants to equipment. Beyond 3 you leave the range Bohemia tuned and the AI can behave erratically."
  "Night Vision Perception"
  "Night Perception Without NVG"
  "Recognition speed at night for an AI that has no night vision lowered, applied only between sunset and sunrise. Same narrow game scale: 1 is standard, 3 is what binoculars give, 0.4 is what suppression leaves. At 1 nothing changes. Below 1 they identify contacts even more slowly in the dark. No effect on an AI wearing lowered night vision, which has its own slider."
  "How quickly this character spots targets by sight. Follows the scenario setting until you enter a value of its own; re-entering the displayed value restores automatic tracking. Below it he sees later, above it sooner and further out."
  "How quickly this group's members spot targets by sight. Follows the scenario setting until you enter a value of its own; re-entering the displayed value restores automatic tracking. Below it they see later, above it sooner and further out."
  "How quickly all AI spot their targets by sight. Default 1: below it they see later, above it sooner and further out. AI under fire always sees far worse, whatever this setting. Only affects AI left at 1: nothing stacks."
  "Perception"
  "Time this character spends steadying his aim before firing. Follows the scenario setting until you enter a value of its own; re-entering the displayed value restores automatic tracking. At 0.3 the shot leaves as fast as possible, an internal floor preventing anything lower; at 3 he takes a long while."
  "Time this group's members spend steadying their aim before firing. Follows the scenario setting until you enter a value of its own; re-entering the displayed value restores automatic tracking."
  "Multiplies the time AI spend steadying their aim before firing. Default 1, roughly four tenths of a second. At 0.3 the shot leaves as fast as possible; below that an internal floor applies, as the barrel must have settled on target before the shot breaks."
  "Aiming Time Before Firing"
  "How far this group's soldiers will return fire at a target aiming at them or shooting at them, even beyond their fire at will range. Always at least equal to that range. Follows the scenario setting until you enter a value of its own. At -1, no limit."
  "How far an AI will return fire at a target aiming at it or shooting at it, even beyond its fire at will range. Always at least equal to that range. At -1, no limit: recommended, otherwise AI can be shot at with impunity from long range."
  "Return Fire Range"
  "This character's marksmanship level. Accuracy only: he opens fire just as fast whatever his level. Widest to tightest: Rookie, Novice, Regular, Veteran, Expert. Cylon aims with no error. Follow global setting hands him back the scenario level."
  "Marksmanship level for every member of the group. Accuracy only: they open fire just as fast whatever their level. Widest to tightest: Rookie, Novice, Regular, Veteran, Expert. Cylon aims with no error. Follow global setting hands them back the scenario level."
  "Marksmanship level for all AI, reinforcements included. Accuracy only: an Expert opens fire as fast as a Rookie, it simply lands its shots far closer. Widest to tightest: Rookie, Novice, Regular, Veteran, Expert. Cylon aims with no error at all."
  "Marksmanship"
  "When enabled, AI stop shooting at a character carrying no weapon at all, while still seeing them and staying alert. The test is a complete absence of weapons: a rifle slung on the back or a sidearm is enough to remain a target. Useful for civilians, prisoners and disarmed casualties."
  "Spare Unarmed Characters"
  "Forces a stance on this character. Automatic: he crouches as soon as he is alerted, even over long distances, and goes prone under fire. Standing, Crouched and Prone lock it permanently. Never prone: standing or crouched, never going to the ground. Standing when alert: upright until he is engaged, then crouched in cover, the most realistic option. Follows the scenario setting by default."
  "Forces a stance on every member of the group. Automatic: each crouches as soon as he is alerted, even over long distances, and goes prone under fire. Standing, Crouched and Prone lock it permanently. Never prone: standing or crouched, never going to the ground. Standing when alert: upright until engaged, then crouched in cover. Follows the scenario setting by default."
  "Steady (no more scanning)"
  "Focused (keeps its contact)"
  "Contact memory"
  "How long, in seconds, an AI keeps looking at a contact it can no longer see. The original game stops after one second: a player only has to duck for a moment for the AI to let go and look elsewhere. Raising it makes the AI keep watching the spot where the contact vanished. A group or a character set to its own value keeps it."
  "How long the group members keep looking at a lost contact, in seconds. Follows the scenario setting until you enter a value of your own; typing the displayed value back restores automatic following."
  "How long this character keeps looking at a lost contact, in seconds. Follows the scenario setting until you enter a value of your own; typing the displayed value back restores automatic following."
  "Gaze"
  "Hold gaze"
  "Gaze behaviour of every AI on the map, reinforcements included. Automatic: original behaviour. Steady: no more constant scanning, the AI keeps its facing but turns towards a danger it perceives. Focused: it also ignores dangers that are not aimed at it and keeps watching a contact it has just lost. Held gaze: only an enemy it sees or fire aimed at it moves its gaze. A character or a group given its own setting keeps it: this one only applies to those left on Follow the general setting."
  "Gaze behaviour of the group members. Automatic: original behaviour. Steady: no more constant scanning, the AI keeps its facing but turns towards a danger it perceives. Focused: it also ignores dangers that are not aimed at it and keeps watching a contact it has just lost. Held gaze: only an enemy it sees or fire aimed at it moves its gaze. Defaults to following the group combat style, which itself falls back to the scenario general setting."
  "Gaze behaviour of this character. Automatic: original behaviour. Steady: no more constant scanning, the AI keeps its facing but turns towards a danger it perceives. Focused: it also ignores dangers that are not aimed at it and keeps watching a contact it has just lost. Held gaze: only an enemy it sees or fire aimed at it moves its gaze. An immobilised AI holds its gaze whatever this setting says. Defaults to following its group."
  "Attention range"
  "Range, in metres, beyond which a noise or an explosion no longer draws an AI's attention. At -1, no limit: original behaviour, a blast at the far end of the village turns every head. Lowering it keeps AI focused on what happens near them, the closest danger winning over the loudest one. No effect on fire aimed at the AI or that has hit it: it always reacts then, whatever the distance."
  "Stance applied to every AI on the map, reinforcements included. Automatic: each one decides for itself, crouching as soon as it is alerted, even over long distances, and going prone under fire. Standing, Crouched and Prone lock it permanently. Never prone: standing or crouched, never going to the ground. Standing when alert: upright until engaged, then crouched in cover, the most realistic option. A character or a group given its own stance keeps it: this setting only concerns those left on Follow Scenario Setting."
  "Stance"
  "This character's vehicle order. Follow scenario setting: his group decides, failing that the scenario. Everyone stays aboard: he no longer dismounts on his own, even in contact. Crew only: he stays only if he is driving or manning a turret. Free disembark: he decides for himself, even if his group or the scenario has set an order."
  "Vehicle order for this group's members. Follow scenario setting: the scenario decides, and the group tracks its changes. Everyone stays aboard: nobody dismounts on their own, even in contact. Crew only: driver and gunners stay, passengers dismount. Free disembark: this group decides for itself, even if the scenario has set an order. Reinforcements adopt the order."
  "Vehicle order applied to every AI on the map, reinforcements included. Everyone stays aboard: nobody dismounts on their own, even in contact. Crew only: driver and gunners stay, passengers dismount as usual. Disembark orders given in Game Master will not run while an order is in force."
  "Range, in metres, at which AI hear a SUPPRESSED shot. Vanilla value is 100 m. At 0 they never hear it, letting you take out a sentry without alerting the area. Unsuppressed shots stay audible at 500 m. Affects AI hearing only, not what players hear."
  "Suppressed Shot Audibility"
  "On by default: the group hoses a position it knows an enemy is firing from, even without seeing him. Only triggers between 30 and 800 metres, on recent information, and never with a friendly in the beaten zone. Disabled, the group only shoots what it can see, quieter but no longer pinning the enemy down."
  "Suppressive Fire"
  "This group's eyesight while under fire. Follows the scenario setting until you enter a value of its own. Vanilla crushes a suppressed AI's perception to roughly a third; towards 8 that penalty is cancelled. Sight only."
  "AI eyesight while under fire. Vanilla crushes their perception to roughly a third: they go nearly blind while being shot at. At 1 nothing changes, towards 8 the penalty is cancelled. Sight only: taking cover and suppression reactions stay vanilla."
  "Perception Under Fire"
  "How fast THIS vehicle's tank drains, whoever is driving. It overrides both the group setting and the scenario setting, so it applies to a player vehicle too. At 0 it consumes nothing at all. Follows the group or the scenario until you enter a value of its own. Session order, not kept across a restart."
  "Unticked, THIS vehicle's tank stops draining, whoever is driving: it overrides both the group setting and the scenario setting, so it applies to a player vehicle too. Useful for a liaison helicopter or a convoy that has to go the distance. Session order, not kept across a restart."
  "Vehicle Fuel Consumption"
  "How strongly vehicles driven by this group are drawn to roads. Follow scenario setting: the scenario decides, and the group tracks its changes. Any other value takes over for this group alone: a convoy tied to the road network while a patrol closes in cross-country. Pushed to the vehicle as soon as one of its drivers takes the seat."
  "How strongly AI-driven vehicles are drawn to each type of ground. Road network only: off-road is reserved for dead ends. Roads preferred (default): roads are favoured, off-road stays on the table. Dirt tracks, Avoid asphalt, Off-road only and Free shift the balance towards cross-country. Pushed to the vehicle as soon as an AI takes the driver seat."
  "Vehicle Navigation"
  "Cruise speed of THIS vehicle when an AI is driving, in km/h. Takes priority over both the driving group's setting and the scenario setting. Follows the scenario until you enter a value of its own. At -1, the vanilla speed applies. Immediate if an AI is at the wheel, no effect on a player driver. Session order, not kept across a restart."
  "Vehicle Speed"
  "Who has to reach this waypoint's radius for it to trigger and complete. Any member (the mod default): the first to arrive is enough, and for Get In or Get Out the move starts as soon as one member enters the radius. Group leader: only the leader counts. Whole group: waits for the last member."
  "Waypoint Completion"
  "Working radius of the selected waypoint, in metres: the area a defending group holds, or the radius of a patrol. The AI leash follows at once, halo included. Applies to the selected waypoint only."
  "Area Radius"
  "Fire order carried by THIS defence area, for any group holding it. Follow group settings (default): the area imposes nothing. Fire at will: free fire inside the area, whatever ranges are set. Return fire only: only at whoever aims at them or shoots at them. Hold fire: observes and never shoots. Delete the area and the group falls back on its own settings."
  "Area Fire Discipline"
  "Combat style imposed by THIS defence area, for any group holding it. Follow group setting (default): the area imposes nothing. Any other choice overrides the group's style for as long as the area exists: formation, spacing, use of cover, aggression. Delete the area and the group falls back on its own style."
