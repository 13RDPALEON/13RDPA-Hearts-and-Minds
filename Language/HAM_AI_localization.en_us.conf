  "Holsters the weapon until the next engagement, then hands the AI back its usual carry setting. Only shown while the weapon is out."
  "Holster Weapon"
  "How this character carries its weapon. Follow scenario setting: its group decides, otherwise the scenario. Automatic: original behaviour. Engagement: weapon out only against an enemy target. Alert: weapon out while the AI remains alert. Kept out: it no longer holsters after its first engagement."
  "How this group's members carry their weapons. Follow scenario setting: the scenario decides. Automatic: original behaviour. Engagement: weapon out only against an enemy target. Alert: weapon out while the AI remains alert. Kept out: they no longer holster after their first engagement. A character with its own setting keeps it."
  "How every AI on the map carries its weapon, reinforcements included. Automatic: original behaviour. Engagement: weapon out only against an enemy target. Alert: weapon out while the AI remains alert. Kept out: it no longer holsters after its first engagement. A group or character with its own setting keeps it."
