  "Fire mode of every AI. Autonomous keeps the original behaviour. The other values force the weapon selector, whenever the weapon has that mode: a machine gun stays on burst. A group or a character with its own setting keeps it."
  "Fire mode of the group members. Follow General Setting lets the scenario decide. The other values force the weapon selector, whenever the weapon has that mode: a machine gun stays on burst. Reinforcements joining the group adopt the setting."
  "AI operators launch reconnaissance drones that spot enemies and report them to friendly groups within the contact sharing range."
  "AI Reconnaissance Drones"
  "Reconnaissance drones may drop a grenade on a spotted target. Only available when AI reconnaissance drones are enabled."
